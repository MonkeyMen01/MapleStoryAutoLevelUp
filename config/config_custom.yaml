# ====== Customized Configuration for 新楓之谷：經典版 (法師 Mage - 無瞬移) ======

game_window:
  title: "新楓之谷：經典版"
  size: [691, 1278]          # 去掉標題列(59px)後的原始視窗尺寸，用來做尺寸驗證。
                             # 注意：除錯視窗的 "Resolution:" 印的是含標題列的原始值(750x1278)，
                             # 而 get_img_frame 最後一律縮放成 1296x700 給引擎用，
                             # 所以 ui_coords 這類座標都是對 1296x700 校的，不要跟著改

nametag:
  enable: True               # 經典版沒有隊伍紅條，只能用名牌定位
  name: "Stackover"          # nametag/Stackover.png，從 21:49:51 的截圖裁出 (59x19)
  mode: "grayscale"          # white_mask 實測會崩掉（分數 0.93~1.0），不要改
  offset: [-50, 32]          # offset[1]=32：名牌上緣往上 32px 是角色中心（實測 y531 vs 499）
  diff_thres: 0.2            # 只有 offset[1] 會被用到，offset[0] 引擎沒讀

bot:
  mode: "normal"        # 跟著 route*.png 跑，會自己上下換平台。
                        # "patrol" 則完全不看地圖、只在原平台來回走並定時攻擊 —— 不會換層，
                        # 適合定點練功；這張圖試過，會動但不找怪
  attack: "directional" # 法師方向性技能 (魔力爪)
  map: "south_forest_training_ground_1"  # 南部森林訓練場1

patrol:
  patrol_attack_interval: 2.2  # 實測 1.2 秒會在 45 秒內把 350 的魔力池抽乾(喝了 3 次藥還是見底)，
                               # MP 一歸零魔力爪就放不出來、等於空揮。
                               # 2.2 秒約是 1.2 秒的一半頻率，讓藥水跟得上
  range: [0.25, 0.75]          # 稍微縮一點，避免走到畫面邊緣掉下平台

key:
  directional_attack: "w"   # ⚔️ W 鍵為魔力爪
  teleport: ""              # 🌀 目前尚未學習瞬間移動，設為 ""
  jump: "alt"               # 🦘 經典版跳躍鍵是 Alt，不是 Space。
                            # 下跳 = 方向鍵下 + Alt，引擎會自己組合這兩個鍵
  add_hp: "1"               # ❤️ 1 鍵為 HP 藥水
  add_mp: "2"               # 💧 2 鍵為 MP 藥水
  party: "p"

buff_skill:
  keys: []                  # 目前若尚無 Buff 技能暫留空
  cooldown: []
  action_cooldown: 1

directional_attack:
  range_x: 350
  range_y: 70
  cooldown: 0.9

monster_detect:
  mode: "color"        # 預設的 contour_only 在經典版是 0 偵測：它靠純黑(0,0,0)輪廓比對，
                       # 但這個客戶端的怪物輪廓有反鋸齒、幾乎沒有純黑像素
  diff_thres: 0.35     # 預設 0.8 對 color 模式是災難：單幀 99 萬個原始比對，
                       # NMS 是 O(n²) 會讓 bot 卡死。0.35 是實測的精度最佳點(73%)，
                       # 再收緊會開始漏怪(0.28 只剩 3 個偵測)
  search_box_margin: 20  # 預設 50 讓搜尋框變成 800x240，多出來的都是背景樹葉(誤判來源)
  hp_bar_color: [0, 243, 0]  # 敵人血條實測顏色。預設 (71,204,64) 在經典版完全對不上，
                             # 導致這個高精度輔助一直是死的。血條只會出現在真的怪物頭上，
                             # 不像模板比對會把樹葉認成史萊姆
  with_enemy_hp_bar: True

health_monitor:
  enable: True
  add_hp_percent: 25   # 藥水一次補 300、滿血才 240，所以每瓶都是滿補。
                       # 門檻越低喝得越少：60% 是每掉 96 血喝一瓶，25% 是每掉 180 血喝一瓶。
                       # 沒有設到 20 是因為 25% = 60 HP，留兩三下被打的緩衝，
                       # 而偵測到低血到實際按下去之間有 add_hp_cooldown 的延遲
  add_mp_percent: 70   # 藍水一瓶只回約 24 點(350 的 6.8%)，從 40% 開始補追不上魔力爪的消耗
  add_hp_cooldown: 0.5
  add_mp_cooldown: 0.5
